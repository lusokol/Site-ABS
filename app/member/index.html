<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon espace — ABS91</title>
    <link rel="icon" type="image/png" href="../../media/cropped-abs.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <button class="sidebar-toggle" id="sidebar-toggle"><i class="fas fa-bars"></i></button>

    <div class="dashboard">
        <aside class="sidebar" id="sidebar"></aside>

        <div class="dashboard-content" style="display: flex; flex-direction: column;">
            <h1 id="welcome">Bienvenue !</h1>

            <div id="balance-banner" style="display:none; background: var(--accent-light, #e8f8f5); border-left: 4px solid var(--primary); padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1.5rem;">
                <i class="fas fa-wallet" style="color: var(--primary);"></i>
                <strong id="balance-amount"></strong> disponibles sur votre solde — <a href="./wallet.html">voir l'historique</a>
            </div>

            <div id="forfait-banner" style="display:none; background:#fce8e6; border-left:4px solid #c0392b; padding:0.75rem 1rem; border-radius:6px; margin-bottom:1.5rem;">
                <i class="fas fa-ticket" style="color:#c0392b;"></i>
                <strong id="forfait-text"></strong>
            </div>

            <h2>Mes prochains cours</h2>
            <div id="upcoming-list"></div>
            <div class="empty-state" id="upcoming-empty" style="display: none; flex: 1; align-items: center; justify-content: center; flex-direction: column;">
                <i class="fas fa-calendar"></i>
                <p>Aucun cours à venir</p>
                <a href="./bookings.html" class="btn btn-primary" style="margin-top: 1rem;">Réserver un cours</a>
            </div>
        </div>
    </div>

    <div class="toast-container" aria-live="polite"></div>

    <script src="../js/auth.js"></script>
    <script>
        // buildSidebar is in auth.js

        const user = requireAuth();
        if (user) {
            buildSidebar(user, 'home');
            const name = user.first_name || user.email;
            document.getElementById('welcome').textContent = `Bienvenue, ${name} !`;
            loadUpcoming();
            loadBalance();
        }

        async function loadBalance() {
            const [walletRes, meRes] = await Promise.all([apiFetch('/wallet/me'), apiFetch('/auth/me')]);
            if (walletRes && walletRes.ok) {
                const { balance_cents } = await walletRes.json();
                if (balance_cents > 0) {
                    document.getElementById('balance-amount').textContent = formatCents(balance_cents);
                    document.getElementById('balance-banner').style.display = 'block';
                }
            }
            if (meRes && meRes.ok) {
                const me = await meRes.json();
                if (me.forfait_indiv_quota !== null && me.forfait_indiv_quota !== undefined) {
                    const q = me.forfait_indiv_quota;
                    document.getElementById('forfait-text').textContent = q > 0
                        ? `Forfait individuel : ${q} créneau${q > 1 ? 'x' : ''} restant${q > 1 ? 's' : ''}`
                        : 'Forfait individuel : quota épuisé';
                    document.getElementById('forfait-banner').style.display = 'block';
                }
            }
        }


        async function loadUpcoming() {
            const res = await apiFetch('/bookings?status=confirmed&upcoming=true');
            if (!res || !res.ok) return;
            const bookings = await res.json();

            const container = document.getElementById('upcoming-list');
            container.innerHTML = '';

            if (bookings.length === 0) {
                document.getElementById('upcoming-empty').style.display = 'flex';
                return;
            }

            bookings.forEach(b => {
                const payStatus = b.payment_method === 'forfait'
                    ? '<span class="badge-status badge-paid">Forfait indiv</span>'
                    : b.payment_status === 'paid'
                        ? (b.payment_method === 'balance'
                            ? '<span class="badge-status badge-paid">Payé (solde)</span>'
                            : '<span class="badge-status badge-paid">Payé</span>')
                        : (b.payment_method === 'card'
                            ? '<span class="badge-status badge-pending">Paiement CB en attente</span>'
                            : '<span class="badge-status badge-pending">Espèces à régler</span>');
                const card = document.createElement('div');
                card.className = 'stat-card';
                card.style.marginBottom = '1rem';
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: start; flex-wrap: wrap; gap: 0.5rem;">
                        <div>
                            <strong>${formatDate(b.date)}</strong> à ${b.start_time}<br>
                            <span style="color: var(--gray-medium);">${b.location} · ${b.duration_min} min</span><br>
                            ${payStatus}
                        </div>
                        <button class="btn btn-outline" style="padding: 0.25rem 0.75rem; font-size: 0.8rem; color: #e74c3c;" onclick="cancelBooking(${b.id})">
                            <i class="fas fa-times"></i> Annuler
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function cancelBooking(id) {
            if (!confirm('Annuler cette réservation ?')) return;
            const res = await apiFetch(`/bookings/${id}`, { method: 'DELETE' });
            if (res && res.ok) {
                const data = await res.json();
                showToast(data.message || 'Réservation annulée');
                loadUpcoming();
                loadBalance();
            } else {
                const data = await res?.json();
                showToast(data?.error || 'Erreur', 'error');
            }
        }
    </script>
</body>
</html>
