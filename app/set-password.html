<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Définir mon mot de passe — ABS91</title>
    <link rel="icon" type="image/png" href="../media/cropped-abs.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <img src="../media/cropped-abs.png" alt="ABS91">
            <h1>Créez votre compte</h1>
            <p>Remplissez vos informations pour accéder à votre espace membre</p>

            <div class="login-error" id="error"></div>

            <form id="set-password-form">
                <div style="display: flex; gap: 0.75rem;">
                    <div class="form-group" style="flex: 1;">
                        <label for="first_name">Prénom</label>
                        <input type="text" id="first_name" required autocomplete="given-name" placeholder="Votre prénom">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="last_name">Nom</label>
                        <input type="text" id="last_name" required autocomplete="family-name" placeholder="Votre nom">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" required minlength="8" autocomplete="new-password" placeholder="Minimum 8 caractères">
                </div>
                <div class="form-group">
                    <label for="confirm">Confirmer le mot de passe</label>
                    <input type="password" id="confirm" required minlength="8" autocomplete="new-password" placeholder="Retapez votre mot de passe">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Valider</button>
            </form>
        </div>
    </div>

    <div class="toast-container" aria-live="polite"></div>

    <script src="js/auth.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            document.getElementById('error').textContent = 'Lien invalide. Contactez l\'administrateur du club.';
            document.getElementById('error').style.display = 'block';
            document.getElementById('set-password-form').style.display = 'none';
        }

        document.getElementById('set-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errDiv = document.getElementById('error');
            errDiv.style.display = 'none';

            const first_name = document.getElementById('first_name').value.trim();
            const last_name = document.getElementById('last_name').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;

            if (!first_name || !last_name) {
                errDiv.textContent = 'Nom et prénom requis';
                errDiv.style.display = 'block';
                return;
            }

            if (password !== confirm) {
                errDiv.textContent = 'Les mots de passe ne correspondent pas';
                errDiv.style.display = 'block';
                return;
            }

            try {
                const res = await fetch(API_BASE + '/auth/set-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password, first_name, last_name }),
                });
                const data = await res.json();

                if (!res.ok) {
                    errDiv.textContent = data.error;
                    errDiv.style.display = 'block';
                    return;
                }

                saveAuth(data.token, data.user);
                showToast('Mot de passe défini avec succès !');
                setTimeout(() => {
                    window.location.href = data.user.role === 'admin' || data.user.role === 'prof'
                        ? SITE_BASE + '/app/admin/'
                        : SITE_BASE + '/app/member/';
                }, 1000);
            } catch {
                errDiv.textContent = 'Erreur de connexion au serveur';
                errDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
