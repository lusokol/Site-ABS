<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — ABS91</title>
    <link rel="icon" type="image/png" href="../media/cropped-abs.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <img src="../media/cropped-abs.png" alt="ABS91">
            <h1>Espace Membres</h1>
            <p>Connectez-vous pour accéder à votre espace</p>

            <div class="login-error" id="login-error"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required autocomplete="email" placeholder="votre@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" required autocomplete="current-password" placeholder="Votre mot de passe">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Se connecter</button>
            </form>

            <p style="margin-top: 1.5rem; font-size: 0.8rem;">
                <a href="../index.html">← Retour au site</a>
            </p>
        </div>
    </div>

    <div class="toast-container" aria-live="polite"></div>

    <script src="js/auth.js"></script>
    <script>
        (async () => {
            const token = getToken();
            if (!token) return;
            const res = await apiFetch('/auth/me');
            if (!res || !res.ok) return;
            const me = await res.json();
            saveAuth(token, me);
            window.location.href = (me.role === 'admin' || me.role === 'prof')
                ? SITE_BASE + '/app/admin/'
                : SITE_BASE + '/app/member/';
        })();

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errDiv = document.getElementById('login-error');
            errDiv.style.display = 'none';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });
                const data = await res.json();

                if (!res.ok) {
                    errDiv.textContent = data.error || 'Erreur de connexion';
                    errDiv.style.display = 'block';
                    return;
                }

                saveAuth(data.token, data.user);
                window.location.href = data.user.role === 'admin' || data.user.role === 'prof'
                    ? SITE_BASE + '/app/admin/'
                    : SITE_BASE + '/app/member/';
            } catch {
                errDiv.textContent = 'Erreur de connexion au serveur';
                errDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
